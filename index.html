<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anna Prata — Performance de Venda</title>
<meta name="description" content="Performance de venda das coleções Anna Prata: % vendida por coleção, canal e peça. Acesso com senha.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Anna Prata — Performance de Venda">
<meta property="og:description" content="% vendida por coleção, canal e peça.">
<meta property="og:url" content="https://luanrodrigues002.github.io/anna-prata-performance/">
<meta property="og:image" content="https://luanrodrigues002.github.io/anna-prata-performance/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#1A1816">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anna Prata">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: acesso por senha → ano → vitrine de coleções (capa + % vendida) → catálogo da coleção ranqueado por peça */
/* Layout: tela de senha com foto (igual ao Painel de Vendas) → ano → vitrine de coleções → catálogo da coleção */
:root{
  color-scheme: light;
  --bg:#F6F4F0; --paper:#FFFFFF; --ink:#1A1816; --muted:#8C867D; --line:#E8E3DB;
  --accent:#A67C2E; --accent-soft:#F3EAD8; --gold-d:#7A5A1E;
  --ch-atacado:#1A1816; --ch-loja:#C9A45C; --ch-site:#8FA3AE;
  --v1:#C9A45C; --v2:#A7ADB4; --v3:#8C6F86; --v4:#6F8C88;
  --ok:#2E7D4F; --good:#6C8A3B; --warn:#B7812C; --bad:#B3261E;
  --ok-bg:#E3F0E8; --good-bg:#ECF1E1; --warn-bg:#F7EDDB; --bad-bg:#F6E1DF;
  --track:#F0ECE5;
  --display:"Cormorant Garamond",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:28px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* senha */
.gate-old{min-height:70vh;display:grid;place-items:center}
.gate form{width:min(380px,100%);display:grid;gap:18px;text-align:center}
.gate .logo{font-family:var(--display);font-size:44px;letter-spacing:.06em;line-height:1}
.gate input{font:inherit;font-size:16px;padding:12px 16px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;text-align:center;letter-spacing:.08em}
.gate .go{border:0;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:999px;cursor:pointer;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:500}
.gate .go:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:20px}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.22em;background:none;border:0;padding:0;cursor:pointer}
.brand small{font-weight:400;font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-left:10px}
.meta{color:var(--muted);font-size:13px}

/* ano */
.yearbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.yearbar h1{font-family:var(--display);font-size:clamp(34px,5vw,54px);line-height:1}
.years{display:flex;gap:8px;flex-wrap:wrap}
.yr{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
.yr[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yr:disabled{opacity:.4;cursor:not-allowed}
.ysum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.ysum div{background:var(--paper);padding:14px 16px;display:grid;gap:2px}
.ysum strong{font-size:24px;font-weight:400}

/* vitrine de coleções */
.colls{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.cc{min-width:0;width:100%;border:1px solid var(--line);background:var(--paper);padding:0;text-align:left;cursor:pointer;display:grid;grid-template-rows:auto 1fr;transition:transform .15s ease,border-color .15s ease}
.cc:hover{border-color:var(--muted)}
.cc img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block}
.cc .b{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.cc h3{font-family:var(--display);font-size:24px;line-height:1.1}
.cc .row{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cc .p{font-family:var(--display);font-size:40px;line-height:1}
@media (prefers-reduced-motion:no-preference){.cc:hover{transform:translateY(-2px)}}

/* detalhe */
.back{justify-self:start;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px}
.hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:32px;align-items:start}
.hero img{width:100%;aspect-ratio:1240/1753;object-fit:cover;display:block}
.score{display:grid;gap:18px;align-content:start}
.score h1{font-family:var(--display);font-size:clamp(40px,6vw,68px);line-height:1;letter-spacing:.02em}
.big{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px}
.pct{font-family:var(--display);font-size:clamp(72px,11vw,128px);line-height:.85}
.pct sup{font-size:.4em;vertical-align:top;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok);background:var(--ok-bg)} .c-good{color:var(--good);background:var(--good-bg)}
.c-warn{color:var(--warn);background:var(--warn-bg)} .c-bad{color:var(--bad);background:var(--bad-bg)}
.scale{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.scale b{font-weight:500;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--paper);padding:14px 16px;display:grid;gap:2px}
.kpi strong{font-size:24px;font-weight:400}
.flow{height:10px;display:flex;background:var(--track);border-radius:2px;overflow:hidden}
.flow i{display:block;height:100%}
.sec{display:grid;gap:14px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-family:var(--display);font-size:30px}
.chans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chan{background:var(--paper);border:1px solid var(--line);padding:18px;display:grid;gap:12px}
.chan-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chan-h .tag{display:flex;align-items:center;gap:8px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.chan .p{font-family:var(--display);font-size:52px;line-height:1}
.rows{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.rows dt{color:var(--muted)} .rows dd{margin:0;text-align:right}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.chart-box{background:var(--paper);border:1px solid var(--line);padding:18px;display:grid;gap:10px}
.chart-scroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
svg text{fill:var(--muted);font-family:var(--sans);font-size:11px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--paper);border:1px solid var(--line);display:grid;grid-template-rows:auto 1fr}
.ph{position:relative;background:var(--track)}
.ph img{width:100%;aspect-ratio:1240/1385;object-fit:cover;display:block}
.rank{position:absolute;top:10px;left:10px;background:var(--paper);color:var(--ink);font-size:11px;letter-spacing:.12em;padding:3px 9px;border-radius:999px}
.ph .pill{position:absolute;top:10px;right:10px}
.body{padding:16px;display:grid;gap:12px;align-content:start}
.nm{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm>div:first-child{min-width:0}
.nm h3{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.nm .code{font-size:12px;color:var(--muted)}
.nm .cp{font-family:var(--display);font-size:44px;line-height:.9;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--muted)}
.trio b{display:block;font-size:17px;font-weight:400;color:var(--ink)}
.minis{display:grid;gap:6px;font-size:12px}
.mini{display:grid;grid-template-columns:minmax(0,96px) 1fr 40px;gap:8px;align-items:center}
.mini .lb{display:flex;gap:6px;align-items:center;color:var(--muted);min-width:0}
.mini .lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .v{text-align:right}
.split{border-top:1px solid var(--line);padding-top:10px}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.note{font-size:13px;color:var(--muted);max-width:75ch;display:grid;gap:6px}
.note b{color:var(--ink);font-weight:500}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero img{max-width:260px}.chans{grid-template-columns:1fr}.kpis,.ysum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.bar i,.flow i{transition:width .5s ease}}

/* ───────── LOGIN (igual ao Painel de Vendas) ───────── */
#login{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,48%);background:#1A1816;z-index:100;overflow:auto}
.login-foto{order:2;position:relative;background:url("capa.webp") no-repeat 50% 22%/cover;min-height:100vh}
.login-foto::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#1A1816 0%,rgba(26,24,22,0) 30%)}
.login-lado{order:1;display:flex;align-items:center;justify-content:center;padding:32px 24px}
.login-box{width:100%;max-width:360px;text-align:center;color:#F4EFE6}
@media (max-width:960px){
  #login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .login-foto{order:0;min-height:0;height:46vh;background-position:50% 18%}
  .login-foto::before{background:linear-gradient(180deg,rgba(26,24,22,0) 45%,#1A1816 100%)}
  .login-lado{order:1;align-items:flex-start;padding:4px 24px 32px}
  .login-form{margin-top:28px!important}
}
.brand-mark{font-family:var(--display);font-weight:600;letter-spacing:.32em;font-size:34px;line-height:1;padding-left:.32em}
.brand-sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#C9B48A;margin-top:10px}
.login-form{margin-top:44px;display:flex;flex-direction:column;gap:12px;text-align:left}
.login-form label{font-size:12px;color:#B8B0A3;letter-spacing:.04em}
.login-form input[type=password]{width:100%;height:50px;border-radius:12px;border:1px solid #3d3832;background:#25221F;color:#fff;padding:0 16px;font-size:16px;outline:none}
.login-form input[type=password]:focus{border-color:var(--accent)}
.btn-gold{height:50px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;letter-spacing:.06em;font-size:15px;margin-top:6px;cursor:pointer;transition:background .15s}
.btn-gold:hover{background:var(--gold-d)}
.btn-gold:disabled{opacity:.6;cursor:wait}
#login-msg{min-height:20px;font-size:13px;color:#E8A39C;text-align:center}
.login-foot{margin-top:36px;font-size:11px;color:#7d766c}
.hide{display:none!important}
/* topo do app */
.top-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-wa{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:0;background:#25D366;color:#073B1E;font-weight:600;font-size:13px;cursor:pointer}
.btn-wa svg{width:18px;height:18px;fill:currentColor}
.btn-ghost{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13px;cursor:pointer}
.brand .bm{font-family:var(--display);font-weight:600;letter-spacing:.22em;font-size:22px}
/* ───────── ABAS ───────── */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:-14px}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:12px 4px;margin-right:18px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab svg{width:16px;height:16px;fill:currentColor}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
/* ───────── COMANDO DE VOZ ───────── */
.voz-hero{background:#1A1816;color:#F4EFE6;border-radius:18px;padding:clamp(24px,5vw,48px) clamp(18px,4vw,48px);display:grid;gap:22px;justify-items:center;text-align:center;position:relative;overflow:hidden}
.voz-hero::before{content:"";position:absolute;inset:auto -20% -60% -20%;height:120%;background:radial-gradient(closest-side,rgba(166,124,46,.28),transparent);pointer-events:none}
.voz-hero h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.6vw,46px);line-height:1.05;position:relative}
.voz-hero p{color:#B8B0A3;max-width:52ch;position:relative;margin:0}
.mic{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 30px rgba(166,124,46,.35);transition:transform .15s,background .15s}
.mic:hover{background:var(--gold-d)}
.mic svg{width:42px;height:42px;fill:currentColor}
.mic.on{background:#B3261E;box-shadow:0 10px 30px rgba(179,38,30,.35)}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(232,163,156,.55);animation:pulse 1.6s ease-out infinite}
.mic.on::after{animation-delay:.8s}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.on::before,.mic.on::after{animation:none}}
.voz-status{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#C9B48A;min-height:18px;position:relative}
.voz-trans{font-family:var(--display);font-size:clamp(20px,3vw,28px);min-height:34px;color:#fff;position:relative;max-width:40ch}
.voz-form{display:flex;gap:8px;width:min(620px,100%);position:relative}
.voz-form input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid #3d3832;background:#25221F;color:#fff;padding:0 16px;font-size:15px;outline:none}
.voz-form input:focus{border-color:var(--accent)}
.voz-form button{height:48px;padding:0 18px;border-radius:12px;border:0;background:#F4EFE6;color:#1A1816;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;position:relative}
.chip{border:1px solid #3d3832;background:transparent;color:#D9D1C4;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:#fff}
.speak{display:flex;align-items:center;gap:8px;font-size:12px;color:#B8B0A3;position:relative;cursor:pointer}
.speak input{accent-color:var(--accent);width:16px;height:16px}
.entendi{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag2{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--gold-d);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;letter-spacing:.04em}
.res-sum{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.res-sum img{width:92px;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.res-sum h2{font-family:var(--display);font-size:30px;line-height:1.05}
.res-sum .big2{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-top:6px}
.res-sum .big2 .p{font-family:var(--display);font-size:54px;line-height:1}
.res-kpis{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--muted);margin-top:8px}
.res-kpis b{color:var(--ink);font-weight:500}
.res-list{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 12px;text-align:left;width:100%;cursor:pointer}
.rrow:hover{border-color:var(--muted)}
.rrow .pos{font-family:var(--display);font-size:22px;color:var(--muted);text-align:center}
.rrow img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--track)}
.rrow .nm2{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.rrow .sub{font-size:12px;color:var(--muted)}
.rrow .bar{margin-top:6px;max-width:260px}
.rrow .val{text-align:right;display:grid;gap:2px;justify-items:end}
.rrow .val .m{font-family:var(--display);font-size:30px;line-height:1}
.rrow .val .l{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.voz-empty{color:var(--muted);text-align:center;padding:24px}
@media (max-width:600px){.rrow{grid-template-columns:52px minmax(0,1fr) auto}.rrow .pos{display:none}.rrow img{width:52px;height:52px}.res-sum{grid-template-columns:1fr}.res-sum img{display:none}}
.card{min-width:0}
.btab{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px;margin-top:6px}
.btab th{font-weight:500;color:var(--muted);text-align:right;padding:4px 0 6px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.btab th:first-child,.btab td:first-child{text-align:left;width:34%}
.btab th:last-child,.btab td:last-child{width:14%}
.btab td{text-align:right;padding:6px 0;border-bottom:1px solid var(--track)}
.btab tr:last-child td{border-bottom:0}
.btab td:last-child{font-weight:600}
.btab .lb{display:flex;gap:6px;align-items:center;min-width:0}
.btab .lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.btab th+th,.btab td+td{padding-left:8px}
.bsub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}.bsub span{display:inline-flex;align-items:center;gap:5px}.bsub b{color:var(--ink);font-weight:600}.bsub .dot{width:8px;height:8px}
.bl{display:grid;gap:10px;margin-top:8px}
.bi{display:grid;gap:5px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.bh .lb{display:flex;gap:7px;align-items:center;font-weight:500}
.bh b{font-size:13px}
.bn{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted)}
.bn b{color:var(--ink);font-weight:600}
.top-act .meta b{color:var(--ink);font-weight:600}
.ysum{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.hl{background:var(--accent-soft)!important}
.hl strong,.hl b{color:var(--gold-d)}
.ffc{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.ffc b{color:var(--gold-d);font-weight:600}
.precos{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted);margin-top:4px}
.precos b{color:var(--ink);font-weight:600}
.ult{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:12px}
.ult li{display:grid;grid-template-columns:42px 52px minmax(0,1fr) auto;gap:6px;color:var(--muted)}
.ult .uv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ult b{color:var(--ink);font-weight:600}
.foot2{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.foot2>div{display:grid;gap:2px;padding:8px 10px;border-radius:8px;background:var(--track)}
.foot2 span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.foot2 b{font-size:15px;font-weight:600}
.hl2 b{color:var(--gold-d)}
.rrow .sub b{color:var(--gold-d)}
@media (max-width:860px){.ysum,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.dias{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.dias b{color:var(--ink);font-weight:600}
.dlg{font-size:14px;margin-top:10px}
.dsm{font-size:12px;margin-top:2px}
.dbadge{display:inline-flex;align-items:center;gap:6px;align-self:start;justify-self:start;width:max-content;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;letter-spacing:.03em}
.dbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dbadge.sm{font-size:11px;padding:3px 10px;margin-top:6px;display:flex}
.dbadge.big{font-size:15px;padding:7px 16px}
.dhero{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px}
.dhero b{color:var(--ink)}
.code .dm{color:var(--gold-d);font-weight:600}

/* pdf */
.acts{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.acts .back{justify-self:auto}
.btn-pdf{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer}
.btn-pdf:hover{background:var(--gold-d)}
.btn-pdf svg{width:16px;height:16px;fill:currentColor}
.pdf-ov{position:fixed;inset:0;background:rgba(26,24,22,.45);display:grid;place-items:center;padding:16px;z-index:50}
.pdf-box{position:relative;width:min(440px,100%);background:var(--paper);border-radius:16px;padding:24px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.pdf-box h2{font-family:var(--display);font-size:30px;line-height:1.1}
.pdf-box p{margin:0}
.pdf-x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.pdf-seg{display:flex;flex-wrap:wrap}
.pdf-st{font-size:13px;min-height:18px;word-break:break-word}
.pdf-acts{display:grid;gap:8px}
.pdf-acts .btn-gold{margin-top:0;height:46px}
.pdf-acts .btn-ghost{height:42px}
</style>
</head>
<body>
<div id="login">
  <div class="login-foto" role="img" aria-label="Anna Prata"></div>
  <div class="login-lado">
  <div class="login-box">
    <div class="brand-mark">ANNA PRATA</div>
    <div class="brand-sub">Performance de Venda</div>
    <form class="login-form" id="gform" autocomplete="on">
      <input type="text" name="username" value="annaprata" autocomplete="username" class="hide" aria-hidden="true" tabindex="-1">
      <label for="pw">Senha de acesso</label>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Digite a senha" required>
      <button class="btn-gold" id="gobtn" type="submit">ENTRAR</button>
      <div id="login-msg" role="alert"></div>
    </form>
    <div class="login-foot">Dados protegidos · somente com senha</div>
  </div>
  </div>
</div>
<div id="app" hidden></div>



<script>
const SALT="rEWDHyVen3fMcwPEc0r4Fg==", ITER=250000;
const CH={atacado:{n:"Canal 03 · Atacado",s:"Atacado",c:"--ch-atacado"},loja:{n:"Canal 18 · Loja",s:"Loja",c:"--ch-loja"},site:{n:"Canal 10 · Site",s:"Site",c:"--ch-site"}};
const CHS=["atacado","loja","site"], VC=["--v1","--v2","--v3","--v4"];
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmt=n=>Math.round(n).toLocaleString("pt-BR");
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const brl2=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function diasDesde(iso){ if(!iso) return null; const [y,m,d]=iso.split("-").map(Number); const a=new Date(y,m-1,d), h=new Date(); h.setHours(0,0,0,0); return Math.floor((h-a)/86400000)+1; }
const ini=x=>x&&(x.inicio_at||x.inicio);
const dataBR=iso=>iso?iso.split("-").reverse().join("/"):"";
const diasTxt=n=>`${fmt(n)} ${n===1?"dia":"dias"} de coleção`;
function diasHTML(iso,v,cls_,isoAt){ const n=diasDesde(iso); if(!n) return ""; return `<span class="${cls_||"dias"}"><b>${diasTxt(n)}</b> · Lançamento do Atacado dia ${dataBR(isoAt||iso)}</span>`; }
const pc=(v,e)=>(v+e)?100*v/(v+e):0;
const pcs=x=>x.toLocaleString("pt-BR",{maximumFractionDigits:1,minimumFractionDigits:1})+"%";
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function cls(p){if(p>=70)return["Excelente","c-ok","--ok"];if(p>=50)return["Boa","c-good","--good"];if(p>=30)return["Regular","c-warn","--warn"];return["Fraca","c-bad","--bad"];}
const pill=p=>{const[t,c]=cls(p);return`<span class="pill ${c}">${t}</span>`};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let PENDING_CH=null, VIEW="colecoes";
let KEY=null, IDX=null, CACHE={}, year=null, chSel="total", sortSel="pct";

async function deriveKey(pw){
  const salt=Uint8Array.from(atob(SALT),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function load(name){
  const r=await fetch(name+"?v="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("arquivo");
  const b=Uint8Array.from(atob((await r.json()).d),c=>c.charCodeAt(0));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},KEY,b.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw){
  KEY=await deriveKey(pw);
  IDX=await load("indice.json");
  try{sessionStorage.setItem("ppv-pw",pw)}catch(e){}
  $("login").classList.add("hide"); $("app").hidden=false;
  const ys=[...new Set(IDX.colecoes.map(c=>c.ano))].sort((a,b)=>b-a); year=ys[0];
  route();
}
$("gform").addEventListener("submit",async e=>{
  e.preventDefault(); $("login-msg").textContent=""; $("gobtn").disabled=true; $("gobtn").textContent="Abrindo…";
  try{await unlock($("pw").value)}catch(err){
    $("login-msg").textContent= err.message==="arquivo" ? "Não foi possível carregar os dados. Recarregue a página." : "Senha incorreta. Tente novamente.";
    KEY=null; $("pw").select();
  }
  $("gobtn").disabled=false; $("gobtn").textContent="ENTRAR";
});
window.addEventListener("hashchange",()=>{ if(KEY) route(); });
(async()=>{ let pw=null; try{pw=sessionStorage.getItem("ppv-pw")}catch(e){} if(pw){ try{await unlock(pw)}catch(e){} } })();

function route(){
  const h=location.hash.replace("#","");
  const c=IDX.colecoes.find(x=>x.id===h);
  if(h==="voz"){ showVoice(); }
  else if(c){ year=c.ano; showColl(c.id, PENDING_CH); PENDING_CH=null; } else showHome();
  window.scrollTo(0,0);
}
function header(){
  return `<header class="top"><button class="brand" id="home-btn" type="button">ANNA PRATA <small>Performance de Venda</small></button><div class="top-act"><span class="meta">${IDX.base.dados?`Dados até <b>${IDX.base.dados}</b> · atualizado em ${IDX.base.atualizado}`:`Vendas até ${IDX.base.vendas} · estoque de ${IDX.base.estoque}`}</span><button class="btn-wa" id="wa-btn" type="button"><svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.2A11.8 11.8 0 0 0 1.8 17.8L.1 24l6.3-1.7A11.8 11.8 0 0 0 23.8 12c0-3.2-1.2-6.1-3.4-8.4z"/></svg>Compartilhar no WhatsApp</button><button class="btn-ghost" id="sair-btn" type="button">Sair</button></div></header>
  <nav class="tabs" aria-label="Seções"><button type="button" id="tab-col" class="tab" aria-pressed="${VIEW!=="voz"}">Coleções</button><button type="button" id="tab-voz" class="tab" aria-pressed="${VIEW==="voz"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2z"/></svg>Comando de voz</button></nav>`;
}
function bindHeader(){ $("home-btn").onclick=()=>{ location.hash=""; showHome(); }; $("wa-btn").onclick=compartilhar; $("sair-btn").onclick=sair; $("tab-col").onclick=()=>{location.hash="";}; $("tab-voz").onclick=()=>{location.hash="voz";}; }
function compartilhar(){
  const url=location.href.split('#')[0];
  const txt=`*Anna Prata — Performance de Venda*\n% vendida por coleção, canal e peça.\n${url}`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
function sair(){ try{sessionStorage.removeItem("ppv-pw")}catch(e){} KEY=null; IDX=null; CACHE={}; $("app").hidden=true; $("app").innerHTML=""; $("login").classList.remove("hide"); $("pw").value=""; location.hash=""; }

/* ---------- vitrine ---------- */
function showHome(){
  VIEW="colecoes";
  const all=IDX.colecoes, ys=[...new Set(all.map(c=>c.ano))].sort((a,b)=>b-a);
  const list=all.filter(c=>c.ano===year);
  let v=0,e=0,r=0,f=0; list.forEach(c=>{v+=c.v;e+=c.e;r+=c.r;f+=(c.f||0)});
  const P=pc(v,e);
  $("app").innerHTML=`<div class="wrap">${header()}
    <section class="yearbar"><h1>Performance de Coleção ${year}</h1>
      <div class="years" role="group" aria-label="Ano">${ys.map(y=>`<button class="yr" id="yr-${y}" data-y="${y}" aria-pressed="${y===year}">${y}</button>`).join("")}</div></section>
    <div class="ysum num">
      <div><span class="eyebrow">Coleções</span><strong>${list.length}</strong></div>
      <div><span class="eyebrow">% vendida no ano</span><strong>${pcs(P)}</strong></div>
      <div><span class="eyebrow">Peças vendidas</span><strong>${fmt(v)}</strong></div>
      <div><span class="eyebrow">Faturado</span><strong>${brl(r)}</strong></div>
      <div class="hl"><span class="eyebrow">Falta faturar</span><strong>${brl(f)}</strong></div>
    </div>
    <div class="sec-h"><div class="eyebrow">Escolha a coleção</div><div class="scale">Classificação: <span><b>Excelente</b> ≥ 70%</span><span><b>Boa</b> 50–69%</span><span><b>Regular</b> 30–49%</span><span><b>Fraca</b> &lt; 30%</span></div></div>
    <section class="colls">${list.map(c=>{const p=pc(c.v,c.e),[,,col]=cls(p);return `<button class="cc" type="button" id="cc-${c.id}" data-id="${c.id}">
      <img src="${c.capa}" alt="Capa ${esc(c.nome)}" loading="lazy">
      <div class="b"><span class="eyebrow">Lançamento ${c.mes}</span><h3>${esc(c.nome)}</h3>${ini(c)?`<span class="dbadge num">${diasTxt(diasDesde(ini(c)))}</span>`:""}
        <div class="row"><span class="p num" style="color:var(${col})">${pcs(p)}</span>${pill(p)}</div>
        <div class="bar"><i style="width:${p}%;background:var(${col})"></i></div>
        <span class="meta num">${fmt(c.v)} de ${fmt(c.v+c.e)} peças · ${c.n} modelos</span>${c.f!=null?`<span class="ffc num">Falta faturar <b>${brl(c.f)}</b></span>`:""}</div></button>`}).join("")}</section>
  </div>`;
  bindHeader();
  document.querySelectorAll(".yr").forEach(b=>b.onclick=()=>{year=+b.dataset.y;showHome();});
  document.querySelectorAll(".cc").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;});
}

/* ---------- coleção ---------- */
const prc=(m,k)=>(k==="atacado"?m.pa:m.pv)||0;
function agg(m,ch,vi){let v=0,e=0,r=0,f=0;m.vars.forEach((x,i)=>{if(vi!=null&&vi!==i)return;for(const k of CHS)if(ch==="total"||ch===k){const y=x.d[k];v+=y.v;e+=y.e;r+=y.r;f+=y.e*prc(m,k);}});return{v,e,r,f,p:pc(v,e)};}
function cAgg(d,ch){let v=0,e=0,r=0,f=0;d.modelos.forEach(m=>{const a=agg(m,ch);v+=a.v;e+=a.e;r+=a.r;f+=a.f});return{v,e,r,f,p:pc(v,e)};}

async function showColl(id, ch){
  VIEW="colecoes";
  const meta=IDX.colecoes.find(c=>c.id===id);
  $("app").innerHTML=`<div class="wrap">${header()}<div class="loading">Abrindo ${esc(meta.nome)}…</div></div>`; bindHeader();
  try{ if(!CACHE[id]) CACHE[id]=await load(`c_${id}.json`); }
  catch(e){ $("app").querySelector(".loading").textContent="Não foi possível abrir esta coleção. Recarregue a página."; return; }
  chSel=ch||"total"; renderColl(id);
}
function renderColl(id){
  const d=CACHE[id], T=cAgg(d,"total"), tot=T.v+T.e;
  const skus=d.modelos.reduce((s,m)=>s+m.vars.length,0);
  $("app").innerHTML=`<div class="wrap">${header()}
  <div class="acts"><button class="back" id="back" type="button">← Coleções ${d.ano}</button><button class="btn-pdf" id="pdf-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM12 11v5.2l-2.1-2.1-1.4 1.4 4.5 4.5 4.5-4.5-1.4-1.4-2.1 2.1V11h-2z"/></svg>Gerar PDF</button></div>
  <section class="hero">
    <img src="${d.capa}" alt="Capa do catálogo ${esc(d.nome)}">
    <div class="score">
      <div><div class="eyebrow">Lançamento ${d.mes} ${d.ano} · ${d.modelos.length} modelos · ${skus} SKUs</div><h1>${esc(d.nome)}</h1>${ini(d)?`<div class="dhero"><span class="dbadge big num">${diasTxt(diasDesde(ini(d)))}</span><span class="meta num">Lançamento do Atacado dia <b>${dataBR(d.inicio_at||d.inicio)}</b></span></div>`:""}</div>
      <div class="big"><div><div class="eyebrow">% vendida da coleção</div><div class="pct num">${T.p.toLocaleString("pt-BR",{maximumFractionDigits:1})}<sup>%</sup></div></div>
        <div style="display:grid;gap:8px;padding-bottom:10px">${pill(T.p)}<div class="meta">${fmt(T.v)} de ${fmt(tot)} peças vendidas</div></div></div>
      <div class="flow">${CHS.map(k=>{const a=cAgg(d,k);return`<i style="width:${100*a.v/tot}%;background:var(${CH[k].c})" title="${CH[k].s}: ${fmt(a.v)}"></i>`}).join("")}</div>
      <div class="legend">${CHS.map(k=>`<span><i class="dot" style="background:var(${CH[k].c})"></i>${CH[k].s} vendeu ${fmt(cAgg(d,k).v)}</span>`).join("")}<span><i class="dot" style="background:var(--track);border:1px solid var(--line)"></i>Estoque ${fmt(T.e)}</span></div>
      <div class="kpis">${[["Entrou",fmt(tot)+" pç"],["Vendido",fmt(T.v)+" pç"],["Em estoque",fmt(T.e)+" pç"],["Faturado",brl(T.r)],["Falta faturar",brl(T.f)]].map(([a,b])=>`<div class="kpi${a==="Falta faturar"?" hl":""}"><span class="eyebrow">${a}</span><strong class="num">${b}</strong></div>`).join("")}</div>
      <div class="scale">Classificação: <span><b>Excelente</b> ≥ 70%</span><span><b>Boa</b> 50–69%</span><span><b>Regular</b> 30–49%</span><span><b>Fraca</b> &lt; 30%</span></div>
    </div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Performance por canal</h2><div class="eyebrow">Canal 03 = atacado (03 + 19)</div></div>
    <div class="chans">${CHS.map(k=>{const a=cAgg(d,k),[,,col]=cls(a.p);return`<article class="chan">
      <div class="chan-h"><span class="tag"><i class="dot" style="background:var(${CH[k].c})"></i>${CH[k].n}</span>${pill(a.p)}</div>
      <div class="p num">${pcs(a.p)}</div><div class="bar"><i style="width:${a.p}%;background:var(${col})"></i></div>
      <dl class="rows num"><dt>Entrou</dt><dd>${fmt(a.v+a.e)}</dd><dt>Vendido</dt><dd>${fmt(a.v)}</dd><dt>Estoque</dt><dd>${fmt(a.e)}</dd><dt>Faturado</dt><dd>${brl(a.r)}</dd><dt>Falta faturar</dt><dd><b>${brl(a.f)}</b></dd><dt>Participação nas vendas</dt><dd>${pcs(T.v?100*a.v/T.v:0)}</dd></dl></article>`}).join("")}</div>
    <div class="chart-box"><div class="sec-h"><div class="eyebrow">Peças vendidas por mês</div><div class="legend">${CHS.map(k=>`<span><i class="dot" style="background:var(${CH[k].c})"></i>${CH[k].s}</span>`).join("")}</div></div>
      <div class="chart-scroll"><svg id="chart" role="img" aria-label="Peças vendidas por mês e canal"></svg></div></div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Peças da coleção</h2>
      <div class="ctrl"><div class="seg" role="group" aria-label="Canal">${[["total","Total"],...CHS.map(k=>[k,CH[k].s])].map(([k,t])=>`<button id="sg-${k}" data-k="${k}" aria-pressed="${k===chSel}">${t}</button>`).join("")}</div>
      <select id="sort" aria-label="Ordenar"><option value="pct">Ordenar por % vendida</option><option value="v">Ordenar por peças vendidas</option><option value="e">Ordenar por maior estoque</option><option value="r">Ordenar por faturamento</option><option value="f">Ordenar por falta faturar</option><option value="pag">Ordem do catálogo</option></select></div></div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="note"><div class="eyebrow">Como ler</div>
    <div><b>Entrou</b> = vendido + estoque atual. <b>% vendida</b> = vendido ÷ entrou. Vendas são líquidas de devoluções.</div>
    ${d.ano<2026?`<div><b>Vendas consideradas:</b> desde o lançamento, somando as vendas de ${d.ano<2025?d.ano+", 2025":d.ano} e de 2026.</div>`:""}
    <div><b>Canal 03 · Atacado</b> soma as entidades 03 (Distribuidora) e 19 (Exposição/Feira). <b>Canal 18</b> = Loja. <b>Canal 10</b> = Site. O % de cada canal usa o vendido e o estoque daquele canal.</div>
    <div><b>Faturado</b> é o valor líquido das vendas no período. <b>Falta faturar</b> é o estoque atual vezes o preço do catálogo: estoque do atacado pelo preço de atacado, estoque da loja e do site pelo preço de varejo (2,4× o atacado).</div>

    <div class="pdf-acts" id="pdf-acts"><button class="btn-gold" type="button" id="pdf-go">Gerar PDF</button></div></div>`;
  document.body.appendChild(ov);
  const fechar=()=>{ov.remove();document.removeEventListener("keydown",esc_);}; const esc_=e=>{if(e.key==="Escape")fechar();};
  document.addEventListener("keydown",esc_); $("pdf-x").onclick=fechar; ov.onclick=e=>{if(e.target===ov)fechar();};
  const reset=()=>{ PDF_OUT=null; $("pdf-st").textContent=""; $("pdf-acts").innerHTML=`<button class="btn-gold" type="button" id="pdf-go">Gerar PDF</button>`; $("pdf-go").onclick=go; };
  ov.querySelectorAll(".pdf-seg button").forEach(b=>b.onclick=()=>{sel=b.dataset.k;ov.querySelectorAll(".pdf-seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));reset();});
  async function go(){
    const bt=$("pdf-go"); bt.disabled=true; bt.textContent="Gerando…"; $("pdf-st").textContent="";
    try{
      PDF_OUT=await gerarPDF(id,sel);
      const file=new File([PDF_OUT.blob],PDF_OUT.nome,{type:"application/pdf"});
      const podeComp=!!(navigator.canShare&&navigator.canShare({files:[file]}));
      $("pdf-st").innerHTML=`PDF pronto: <b>${esc(PDF_OUT.nome)}</b>`;
      $("pdf-acts").innerHTML=`${podeComp?`<button class="btn-gold" type="button" id="pdf-share">Enviar (WhatsApp…)</button>`:""}<button class="${podeComp?"btn-ghost":"btn-gold"}" type="button" id="pdf-dl">Baixar PDF</button><button class="btn-ghost" type="button" id="pdf-open">Abrir</button>`;
      const url=URL.createObjectURL(PDF_OUT.blob);
      $("pdf-dl").onclick=()=>{const a=document.createElement("a");a.href=url;a.download=PDF_OUT.nome;document.body.appendChild(a);a.click();a.remove();};
      $("pdf-open").onclick=()=>window.open(url,"_blank");
      if(podeComp) $("pdf-share").onclick=async()=>{ try{ await navigator.share({files:[file],title:PDF_OUT.titulo,text:`Anna Prata — Performance de Venda · ${PDF_OUT.titulo}`}); }catch(e){} };
    }catch(e){
      $("pdf-st").textContent=e.message==="lib"?"Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.":"Não foi possível gerar o PDF. Tente de novo.";
      bt.disabled=false; bt.textContent="Gerar PDF"; console.error(e);
    }
  }
  $("pdf-go").onclick=go;
}

/* ═════════ COMANDO DE VOZ ═════════ */
const nrm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9%\s]/g," ").replace(/\s+/g," ").trim();
const COLL_KEYS={
  aflora1:["tulipa","tulipas","aflora 1","aflora i","aflora um","capitulo 1","capitulo i","capitulo um"],
  aflora2:["orquidea","orquideas","aflora 2","aflora ii","aflora dois","capitulo 2","capitulo ii","capitulo dois"],
  harmonia:["harmonia"], voo:["o voo","voo","essenciais","essencial"], maes:["dia das maes","das maes","maes","mae"],
  camadas:["entre camadas","camadas","camada"], doma:["doma"], sophia:["sophia","sofia"],
  golden:["golden age","golden","goldem","golde"], luce:["luce","luci","lucy","luche","lucie"], decada:["decada","decadas"], impeto:["impeto","impetu","im peto","impetos"],
  margarida:["margarida","margaridas","hello anna margarida"], voltando:["voltando a essencia","voltando"], abelha:["abelha","abelhas"],
  faces:["faces","face"], maes25:["dia das maes 2025","dia das maes de 2025","maes 2025"], doma2:["doma 2","doma ii","doma dois"],
  aviva:["aviva","a viva"], tresformas:["tres formas","essencia em tres formas"], chuva:["chuva","leo romano"],
  corpoalma:["corpo e alma","corpo alma"], brumma:["brumma","bruma","bruna"], almar:["almar","al mar"], move:["o que te move","te move","que te move"],
  ahmar:["ah mar","a mar","ahmar"], helloahmar:["hello ah mar","hello anna ah mar"], aurora:["aurora"], libelulas:["libelula","libelulas"],
  maes24:["dia das maes 2024","dia das maes de 2024","maes 2024"], doma1:["doma 1","doma i","doma um","country"], eterea:["eterea","casulo"],
  metamorfose:["metamorfose","eterea 2","eterea parte 2"], babado:["babado","babados"], orquideas:["babado orquidea","babados orquideas","drop babados","thatyana"],
  beijaflor:["beija flor","beijaflor"], jaguar:["jaguar","onca"], duna:["duna","dunas"]
};
const MESES=["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const GRUPOS={anel:["anel","aneis"],brinco:["brinco","brincos"],colar:["colar","colares"],choker:["choker","chokers"],bracelete:["bracelete","braceletes"],pulseira:["pulseira","pulseiras"],argola:["argola","argolas"],piercing:["piercing","piercings"],gargantilha:["gargantilha","gargantilhas"],broche:["broche","broches"],falange:["falange","falanges"],earcuff:["earcuff","ear cuff"],earhook:["earhook","ear hook"],lenco:["lenco","lencos"],bandana:["bandana"]};
const NUMS={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,quinze:15,vinte:20};
const has=(q,w)=>new RegExp("(^| )"+w+"( |$)").test(q);

function parseVoz(texto){
  const q=" "+nrm(texto)+" ";
  const r={colls:[],ch:"total",intent:"pct",dir:"desc",n:null,grupo:null,banho:null,texto};
  // canal (loja virtual antes de loja)
  if(/loja virtual|e ?commerce|ecommerce|online|internet|(^| )site( |$)|canal 10|canal dez/.test(q)) r.ch="site";
  else if(/atacad|canal 0?3( |$)|canal tres|canal 19|canal dezenove|distribuidora|feira/.test(q)) r.ch="atacado";
  else if(/(^| )lojas?( |$)|loja fisica|varejo|canal 18|canal dezoito|filial/.test(q)) r.ch="loja";
  // coleções
  const anoQ=(q.match(/ (20\d\d) /)||[])[1]; if(anoQ) r.ano=+anoQ;
  let achou=[]; for(const [id,ks] of Object.entries(COLL_KEYS)){ const L=ks.filter(k=>q.includes(" "+k+" ")).map(k=>k.length); if(L.length) achou.push([id,Math.max(...L)]); }
  if(achou.length){ const mx=Math.max(...achou.map(a=>a[1])); achou=achou.filter(a=>a[1]>=mx-0); }
  achou=achou.map(a=>a[0]).filter(id=>IDX.colecoes.some(c=>c.id===id));
  if(achou.length>1){ const ano=r.ano||year; const so=achou.filter(id=>IDX.colecoes.find(c=>c.id===id).ano===ano); if(so.length) achou=so; }
  r.colls.push(...achou);
  if(!r.colls.length && has(q,"aflora")) r.colls.push("aflora1","aflora2");
  if(!r.colls.length){ MESES.forEach((m,i)=>{ if(has(q,m)) IDX.colecoes.filter(c=>c.mnum===i+1&&c.ano===(r.ano||year)).forEach(c=>r.colls.push(c.id)); }); }
  // grupo e banho
  for(const [g,ks] of Object.entries(GRUPOS)) if(ks.some(k=>q.includes(" "+k+" "))){ r.grupo=g; break; }
  if(/dourad/.test(q)) r.banho="dourado"; else if(/(^| )prata( |$)|prateado/.test(q)) r.banho="prata";
  // quantidade
  const mN=q.match(/(?:top|os|as|primeiros|primeiras)? ?(\d{1,2}) (?:modelos|pecas|produtos|itens|mais|menos|melhores|piores)/)||q.match(/top ?(\d{1,2})/);
  if(mN) r.n=+mN[1]; else for(const [w,v] of Object.entries(NUMS)) if(new RegExp(" "+w+" (modelos|pecas|produtos|itens|mais|menos|melhores|piores)").test(q)){ r.n=v; break; }
  // intenção
  const menos=/menos|menor|menores|pior|piores|fraca|fracos|fracas|baixa/.test(q);
  if(/estoque|encalhad|parad|sobrand|sobra /.test(q) && !/falta fatur|a faturar|potencial|valor em estoque|estoque em reais|dinheiro parado/.test(q)){ r.intent="e"; r.dir=/menos estoque|menor estoque|sem estoque|zerad|acabando/.test(q)?"asc":"desc"; }
  else if(/falta fatur|falta vender|a faturar|potencial|valor em estoque|estoque em reais|dinheiro parado/.test(q)){ r.intent="f"; r.dir=menos?"asc":"desc"; }
  else if(/fatur|receita|dinheiro|valor vendido|reais/.test(q)){ r.intent="r"; r.dir=menos?"asc":"desc"; }
  else if(/mais vend|vendeu mais|vendem mais|campe|quantidade vendida|pecas vendidas|vendidos|vendidas/.test(q) && !/%|porcent|percent/.test(q)){ r.intent="v"; r.dir=menos?"asc":"desc"; }
  else { r.intent="pct"; r.dir=menos?"asc":"desc"; }
  r.rankColecoes = !r.colls.length && !r.grupo && /colec/.test(q) && !/modelo|peca|produto/.test(q);
  return r;
}

async function ensureColl(id){ if(!CACHE[id]) CACHE[id]=await load(`c_${id}.json`); return CACHE[id]; }
function varMatch(lab,b){ const l=nrm(lab); return b==="dourado"? /dourad|gold/.test(l) : /prata/.test(l); }
function aggF(m,ch,banho){ if(!banho) return agg(m,ch); let v=0,e=0,r=0,f=0,ok=false;
  m.vars.forEach(x=>{ if(!varMatch(x.lab,banho)) return; ok=true; for(const k of CHS) if(ch==="total"||ch===k){v+=x.d[k].v;e+=x.d[k].e;r+=x.d[k].r;f+=x.d[k].e*prc(m,k);} });
  return ok?{v,e,r,f,p:pc(v,e)}:null; }
const CHN={total:"Todos os canais",atacado:"Canal 03 · Atacado",loja:"Canal 18 · Loja",site:"Canal 10 · Site"};
const INT={f:["Falta faturar","Maior falta faturar","Menor falta faturar"],pct:["% vendida","Maior % vendida","Menor % vendida"],v:["Peças vendidas","Mais vendidos","Menos vendidos"],e:["Em estoque","Mais estoque","Menos estoque"],r:["Faturamento","Maior faturamento","Menor faturamento"]};
const GN={anel:"Anéis",brinco:"Brincos",colar:"Colares",choker:"Chokers",bracelete:"Braceletes",pulseira:"Pulseiras",argola:"Argolas",piercing:"Piercings",gargantilha:"Gargantilhas",broche:"Broches",falange:"Falanges",earcuff:"Earcuffs",earhook:"Earhooks",lenco:"Lenços",bandana:"Bandanas"};

let FALAR=true; try{ FALAR=localStorage.getItem("ppv-falar")!=="0"; }catch(e){}
let REC=null, OUVINDO=false, LAST=null;

function showVoice(){
  VIEW="voz";
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const ex=["Performance da coleção Década no atacado","Modelos com mais estoque da Década no atacado","Mais vendidos da Golden Age no site","Performance da Sophia na loja","Anéis com mais estoque da Luce","Ranking das coleções no site","Quanto falta faturar da Sophia","Modelos com mais falta faturar no atacado"];
  $("app").innerHTML=`<div class="wrap">${header()}
  <section class="voz-hero">
    <h1>Pergunte em voz alta</h1>
    <p>Toque no microfone e fale. Ex.: “performance da Década no atacado” ou “modelos com mais estoque da Luce no site”.</p>
    <button class="mic" id="mic" type="button" aria-label="Falar">${SR?'':''}<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2z"/></svg></button>
    <div class="voz-status" id="vstatus">${SR?"Toque para falar":"Este navegador não aceita voz. Digite abaixo."}</div>
    <div class="voz-trans" id="vtrans"></div>
    <form class="voz-form" id="vform"><input id="vq" type="text" placeholder="Ou digite sua pergunta" autocomplete="off"><button type="submit">Buscar</button></form>
    <div class="chips">${ex.map((e,i)=>`<button class="chip" type="button" id="ex-${i}">${e}</button>`).join("")}</div>
    <label class="speak"><input type="checkbox" id="vfalar" ${FALAR?"checked":""}> Responder em voz alta</label>
  </section>
  <section class="sec" id="vres"></section></div>`;
  bindHeader();
  $("vfalar").onchange=e=>{FALAR=e.target.checked; try{localStorage.setItem("ppv-falar",FALAR?"1":"0")}catch(_){}; if(!FALAR&&window.speechSynthesis) speechSynthesis.cancel();};
  $("vform").onsubmit=e=>{e.preventDefault(); const t=$("vq").value.trim(); if(t){ $("vtrans").textContent="“"+t+"”"; buscarVoz(t);} };
  ex.forEach((e,i)=>$("ex-"+i).onclick=()=>{ $("vq").value=e; $("vtrans").textContent="“"+e+"”"; buscarVoz(e); });
  $("mic").onclick=()=>{
    if(!SR){ $("vq").focus(); return; }
    if(OUVINDO&&REC){ REC.stop(); return; }
    if(window.speechSynthesis) speechSynthesis.cancel();
    REC=new SR(); REC.lang="pt-BR"; REC.interimResults=true; REC.maxAlternatives=1; REC.continuous=false;
    let final="";
    REC.onstart=()=>{OUVINDO=true; $("mic").classList.add("on"); $("vstatus").textContent="Ouvindo…"; $("vtrans").textContent="";};
    REC.onresult=ev=>{ let txt=""; for(const res of ev.results){ txt+=res[0].transcript; if(res.isFinal) final=txt; } $("vtrans").textContent="“"+txt+"”"; };
    REC.onerror=ev=>{ $("vstatus").textContent= ev.error==="not-allowed"||ev.error==="service-not-allowed" ? "Libere o microfone para este site e tente de novo" : ev.error==="no-speech" ? "Não ouvi nada. Toque e fale de novo" : "Não consegui ouvir. Tente de novo ou digite"; };
    REC.onend=()=>{ OUVINDO=false; $("mic").classList.remove("on"); const t=final||($("vtrans").textContent||"").replace(/[“”]/g,"");
      if(t.trim()){ $("vstatus").textContent="Buscando…"; $("vq").value=t; buscarVoz(t); } else if($("vstatus").textContent==="Ouvindo…") $("vstatus").textContent="Toque para falar"; };
    try{ REC.start(); }catch(e){ $("vstatus").textContent="Não consegui abrir o microfone"; }
  };
  if(LAST) buscarVoz(LAST,true);
}

function falar(txt){ if(!FALAR||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang="pt-BR"; u.rate=1.03; const v=speechSynthesis.getVoices().find(v=>/pt(-|_)BR/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }
const pfala=x=>x.toLocaleString("pt-BR",{maximumFractionDigits:1})+" por cento";

async function buscarVoz(texto, silencioso){
  LAST=texto;
  const P=parseVoz(texto), out=$("vres"); if(!out) return;
  out.innerHTML=`<div class="voz-empty">Buscando…</div>`;
  const yr=P.ano||year, base=IDX.colecoes.filter(c=>c.ano===yr);
  const ids=P.colls.length?P.colls:base.map(c=>c.id);
  try{ await Promise.all(ids.map(ensureColl)); }catch(e){ out.innerHTML=`<div class="voz-empty">Não consegui carregar os dados. Recarregue a página.</div>`; return; }
  if($("vstatus")) $("vstatus").textContent="Toque para falar";
  const tags=[]; tags.push(P.colls.length?P.colls.map(id=>IDX.colecoes.find(c=>c.id===id).nome).join(" + "):`Todas as coleções ${yr}`);
  tags.push(CHN[P.ch]); if(P.grupo) tags.push(GN[P.grupo]); if(P.banho) tags.push(P.banho==="dourado"?"Dourado":"Prata");
  const lab=INT[P.intent][P.dir==="desc"?1:2]; tags.push(P.rankColecoes?"Ranking de coleções · "+INT[P.intent][0]:lab);
  let html=`<div class="entendi"><span class="eyebrow">Entendi</span>${tags.map(t=>`<span class="tag2">${esc(t)}</span>`).join("")}</div>`;
  const metric=(a)=>P.intent==="pct"?pcs(a.p):P.intent==="r"?brl(a.r):P.intent==="f"?brl(a.f):fmt(P.intent==="v"?a.v:a.e)+" pç";
  const key=a=>P.intent==="pct"?a.p:P.intent==="r"?a.r:P.intent==="f"?a.f:P.intent==="v"?a.v:a.e;
  const sgn=P.dir==="desc"?-1:1;

  if(P.rankColecoes){
    const rows=ids.map(id=>{const d=CACHE[id]; let v=0,e=0,r=0,f=0; d.modelos.forEach(m=>{const a=agg(m,P.ch);v+=a.v;e+=a.e;r+=a.r;f+=a.f}); return {id,d,a:{v,e,r,f,p:pc(v,e)}};}).sort((x,y)=>sgn*(key(x.a)-key(y.a)));
    html+=`<div class="res-list">${rows.map((x,i)=>{const[,,col]=cls(x.a.p);return`<button class="rrow" type="button" data-c="${x.id}"><span class="pos">${i+1}</span><img src="${x.d.capa}" alt=""><div><div class="nm2">${esc(x.d.nome)}</div><div class="sub">Lançamento ${x.d.mes} · ${fmt(x.a.v)} vendidas · ${fmt(x.a.e)} em estoque</div><div class="bar"><i style="width:${x.a.p}%;background:var(${col})"></i></div></div><div class="val"><span class="m num" style="color:var(${P.intent==="pct"?col:"--ink"})">${metric(x.a)}</span>${pill(x.a.p)}</div></button>`}).join("")}</div>`;
    out.innerHTML=html; bindRows(out,P);
    const t=rows[0]; if(!silencioso&&t) falar(`${INT[P.intent][P.dir==="desc"?1:2]} no ${CHN[P.ch].split("·").pop().trim()}: ${t.d.nome}, com ${P.intent==="pct"?pfala(t.a.p):metric(t.a).replace("pç","peças")}.`);
    return;
  }
  // modelos
  let rows=[]; ids.forEach(id=>{ const d=CACHE[id]; d.modelos.forEach(m=>{ if(P.grupo && !nrm(m.grupo+" "+m.nome).includes(P.grupo)) return; const a=aggF(m,P.ch,P.banho); if(!a||(a.v+a.e)===0) return; rows.push({id,d,m,a}); }); });
  // resumo
  let S={v:0,e:0,r:0,f:0}; rows.forEach(x=>{S.v+=x.a.v;S.e+=x.a.e;S.r+=x.a.r;S.f+=x.a.f}); S.p=pc(S.v,S.e);
  const one=P.colls.length===1?CACHE[P.colls[0]]:null;
  const titulo=(one?one.nome:P.colls.length?tags[0]:`Coleções ${yr}`)+(P.grupo?" · "+GN[P.grupo]:"");
  html+=`<div class="res-sum">${one?`<img src="${one.capa}" alt="">`:""}<div><div class="eyebrow">${esc(CHN[P.ch])}</div><h2>${esc(titulo)}</h2>
    <div class="big2"><span class="p num" style="color:var(${cls(S.p)[2]})">${pcs(S.p)}</span>${pill(S.p)}<span class="meta">vendida</span></div>
    ${one?diasHTML(ini(one),S.v,"dias",ini(one)):""}<div class="res-kpis num"><span>Entrou <b>${fmt(S.v+S.e)}</b></span><span>Vendido <b>${fmt(S.v)}</b></span><span>Estoque <b>${fmt(S.e)}</b></span><span>Faturado <b>${brl(S.r)}</b></span><span class="hl2">Falta faturar <b>${brl(S.f)}</b></span><span><b>${rows.length}</b> modelos</span></div></div></div>`;
  rows.sort((x,y)=>sgn*(key(x.a)-key(y.a)));
  const lista=P.n?rows.slice(0,P.n):rows;
  html+=`<div class="sec-h"><h2>${esc(lab)}</h2><span class="meta">${P.n?`Top ${P.n} de ${rows.length}`:`${rows.length} modelos`} · toque para abrir a coleção</span></div>`;
  html+= lista.length? `<div class="res-list">${lista.map((x,i)=>{const[,,col]=cls(x.a.p);return`<button class="rrow" type="button" data-c="${x.id}"><span class="pos">${i+1}</span><img src="${x.m.img}" alt="" loading="lazy"><div><div class="nm2">${esc(x.m.nome)}</div><div class="sub">${x.m.mod}${one?"":" · "+esc(x.d.nome)}${x.m.pa?` · atacado ${brl2(x.m.pa)} · varejo ${brl2(x.m.pv)}`:""} · falta faturar <b>${brl(x.a.f)}</b> · entrou ${fmt(x.a.v+x.a.e)} · vendido ${fmt(x.a.v)} · estoque ${fmt(x.a.e)}</div><div class="bar"><i style="width:${x.a.p}%;background:var(${col})"></i></div><div class="bsub num">${x.m.vars.map((vv,vi)=>{ if(P.banho&&!varMatch(vv.lab,P.banho)) return ""; const z=agg(x.m,P.ch,vi); return `<span><i class="dot" style="background:var(${banhoCor(vv.lab,vi)})"></i>${esc(vv.lab==="Único"?"Único":vv.lab)}: vendido <b>${fmt(z.v)}</b> · estoque <b>${fmt(z.e)}</b></span>`}).join("")}</div></div><div class="val"><span class="m num" style="color:var(${P.intent==="pct"?col:"--ink"})">${metric(x.a)}</span><span class="l">${P.intent==="pct"?cls(x.a.p)[0]:pcs(x.a.p)+" vendida"}</span></div></button>`}).join("")}</div>`
    : `<div class="voz-empty">Nenhum modelo encontrado para esse pedido.</div>`;
  out.innerHTML=html; bindRows(out,P);
  if(!silencioso){
    const canal=P.ch==="total"?"":" no "+CHN[P.ch].split("·").pop().trim().toLowerCase();
    const nd=one?diasDesde(ini(one)):null;
    let f=`${titulo}${canal}${nd?`, vendendo há ${nd} dias`:""}: ${pfala(S.p)} vendida, ${fmt(S.v)} peças vendidas e ${fmt(S.e)} em estoque.`;
    if(P.intent==="f") f+=` Falta faturar ${brl(S.f)}.`;
    if(lista[0]) f+=` ${lab}: ${lista[0].m.nome}, ${P.intent==="pct"?pfala(lista[0].a.p):metric(lista[0].a).replace("pç","peças")}.`;
    falar(f);
  }
  out.scrollIntoView({behavior:"smooth",block:"start"});
}
function bindRows(out,P){ out.querySelectorAll(".rrow").forEach(b=>b.onclick=()=>{ PENDING_CH=P.ch; location.hash=b.dataset.c; }); }

</script>
